<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="icon" width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- basalt rounded-square badge -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#171a17" />

  <!-- summit peak, flag-orange, outlined in vellum for crispness at tiny sizes -->
  <path d="M32 13 L50 47 L14 47 Z" fill="#ff5b34" stroke="#eae7de" stroke-width="2" stroke-linejoin="round" />

  <!-- shaded left facet for a touch of dimension -->
  <path d="M32 13 L37 47 L23 47 Z" fill="#e8471f" opacity="0.55" />

  <!-- survey flag at the summit -->
  <line x1="32" y1="13" x2="32" y2="5" stroke="#eae7de" stroke-width="2.4" stroke-linecap="round" />
  <path d="M32 5.5 L41 8.5 L32 11.5 Z" fill="#eae7de" />
</svg>
</body>
</html>
